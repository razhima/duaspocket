<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up - Duas Pocket</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="auth-container">

<div class="auth-card">

<div class="auth-logo">

🕌

<h1>Create Account</h1>

<p>
Join Duas Pocket
</p>

</div>

<form id="signupForm">

<input
type="text"
id="name"
class="input"
placeholder="Full Name"
required>

<input
type="email"
id="email"
class="input"
placeholder="Email Address"
required>

<input
type="password"
id="password"
class="input"
placeholder="Password"
required>

<input
type="password"
id="confirmPassword"
class="input"
placeholder="Confirm Password"
required>

<button
type="submit"
class="btn full-btn">

Create Account

</button>

</form>

<div class="auth-footer">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
