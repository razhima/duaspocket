<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - Duas Pocket</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="auth-container">

<div class="auth-card">

<div class="auth-logo">

🕌

<h1>Duas Pocket</h1>

<p>
Welcome Back
</p>

</div>

<form id="loginForm">

<input
type="email"
id="email"
class="input"
placeholder="Email Address"
required>

<input
type="password"
id="password"
class="input"
placeholder="Password"
required>

<button
type="submit"
class="btn full-btn">

Login

</button>

</form>

<div class="auth-footer">

Don't have an account?

<a href="signup.html">

Sign Up

</a>

</div>

</div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
